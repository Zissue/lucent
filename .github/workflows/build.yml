name: Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag (e.g., v0.0.1)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Existing release tag (e.g., v0.0.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  build_electron:
    name: Build Electron App
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: pnpm release:validate "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Verify
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Audit dependencies
        continue-on-error: true
        run: |
          pnpm audit --audit-level high

      - name: Build electron app
        run: pnpm run dist:app:all

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./app/build/Lucent-*-mac-*.dmg
            ./app/build/Lucent-*-win-*.zip
            ./app/build/Lucent-*-linux-*.AppImage
            ./app/build/Lucent-*-linux-*.zip
