name: Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag (leave empty to package the selected branch without a release)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Existing release tag (e.g., v0.0.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build_ruffle:
    name: Build pinned Ruffle web assets
    uses: ./.github/workflows/ruffle.yml
    permissions:
      contents: read
  build_electron:
    name: Build Electron App
    needs: build_ruffle
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag_name && format('refs/tags/{0}', inputs.tag_name) || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        if: env.RELEASE_TAG != ''
        run: pnpm release:validate "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Verify
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Audit dependencies
        continue-on-error: true
        run: |
          pnpm audit --audit-level high

      - name: Remove locally built Ruffle assets
        run: rm -rf assets/ruffle

      - name: Download CI-built Ruffle assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ruffle-web
          path: assets/ruffle

      - name: Build electron app
        run: pnpm run dist:app:all

      - name: Create draft release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./app/build/Lucent-*-mac-*.dmg
            ./app/build/Lucent-*-win-*.zip
            ./app/build/Lucent-*-linux-*.AppImage
            ./app/build/Lucent-*-linux-*.zip

      - name: Upload packaged app
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lucent-packaged
          if-no-files-found: error
          retention-days: 14
          path: |
            ./app/build/Lucent-*-mac-*.dmg
            ./app/build/Lucent-*-win-*.zip
            ./app/build/Lucent-*-linux-*.AppImage
            ./app/build/Lucent-*-linux-*.zip
