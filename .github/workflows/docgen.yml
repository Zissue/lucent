name: Generate Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docgen.yml'
      - 'app/package.json'
      - 'app/src/shared/**/*.ts'
      - 'app/src/renderer/apps/game/**/*.ts'
      - 'app/tsconfig.json'
      - 'packages/core/package.json'
      - 'packages/core/src/**/*.ts'
      - 'packages/core/tsconfig.json'
      - 'packages/game/package.json'
      - 'packages/game/src/**/*.ts'
      - 'packages/game/tsconfig.json'
      - 'script-packages/**'
      - 'scripts/docgen.ts'
      - 'scripts/docgen-packages.ts'
      - 'scripts/gen-script-types.ts'
      - 'scripts/ts-ast-utils.ts'
      - 'docs/blume.config.ts'
      - 'docs/package.json'
      - 'docs/public/script-api.d.ts'
      - 'docs/src/content/docs/reference/scripting/**'
      - 'docs/tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - '.github/workflows/docgen.yml'
      - 'app/package.json'
      - 'app/src/shared/**/*.ts'
      - 'app/src/renderer/apps/game/**/*.ts'
      - 'app/tsconfig.json'
      - 'packages/core/package.json'
      - 'packages/core/src/**/*.ts'
      - 'packages/core/tsconfig.json'
      - 'packages/game/package.json'
      - 'packages/game/src/**/*.ts'
      - 'packages/game/tsconfig.json'
      - 'script-packages/**'
      - 'scripts/docgen.ts'
      - 'scripts/docgen-packages.ts'
      - 'scripts/gen-script-types.ts'
      - 'scripts/ts-ast-utils.ts'
      - 'docs/blume.config.ts'
      - 'docs/package.json'
      - 'docs/public/script-api.d.ts'
      - 'docs/src/content/docs/reference/scripting/**'
      - 'docs/tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: docgen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    env:
      SKIP_DOCGEN: >-
        ${{ github.event_name == 'pull_request' &&
        contains(github.event.pull_request.body, '[skip-docgen]') }}

    steps:
      - name: Checkout repository
        if: env.SKIP_DOCGEN != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup pnpm
        if: env.SKIP_DOCGEN != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        if: env.SKIP_DOCGEN != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        if: env.SKIP_DOCGEN != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate documentation
        if: env.SKIP_DOCGEN != 'true'
        run: pnpm run docgen

      - name: Report generated documentation drift
        id: docgen-drift
        if: github.event_name == 'pull_request'
        env:
          CAN_AUTO_UPDATE: >-
            ${{ github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' }}
        run: |
          if [ "$SKIP_DOCGEN" = "true" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Generated scripting docs check skipped"
              echo
              echo 'The pull request body contains `[skip-docgen]`. This run did not generate, check, or commit scripting documentation.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          doc_paths=(
            docs/public/script-api.d.ts
            docs/src/content/docs/reference/scripting
          )

          status="$(git status --porcelain -- "${doc_paths[@]}")"
          if [ -z "$status" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Generated scripting docs are up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "stale=true" >> "$GITHUB_OUTPUT"
          git diff --stat -- "${doc_paths[@]}"
          git status --short -- "${doc_paths[@]}"

          if [ "$CAN_AUTO_UPDATE" = "true" ]; then
            summary_title="### Generated scripting docs will be updated"
            summary_message="This workflow will commit the generated docs to the pull request."
            echo "::notice title=Generated docs will be updated::Committing the generated docs to the pull request."
          else
            summary_title="### Generated scripting docs need an update"
            summary_message='Run `pnpm run docgen` locally and commit the generated docs.'
            echo "::warning title=Generated docs are stale::Run pnpm run docgen and commit the generated docs."
          fi

          {
            echo "$summary_title"
            echo
            echo "$summary_message"
            echo
            echo "Changed generated files:"
            echo '```'
            git status --short -- "${doc_paths[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push PR documentation updates
        id: pr-docgen-update
        if: >-
          github.event_name == 'pull_request' &&
          steps.docgen-drift.outputs.stale == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A docs/public/script-api.d.ts docs/src/content/docs/reference/scripting
          git commit -m "docs: auto-update API documentation"
          gh auth setup-git
          git push origin "HEAD:${HEAD_REF}"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync PR documentation drift comment
        if: github.event_name == 'pull_request'
        env:
          AUTO_UPDATE_SHA: ${{ steps.pr-docgen-update.outputs.head_sha }}
          AUTO_UPDATED: ${{ steps.pr-docgen-update.outputs.updated }}
          GH_TOKEN: ${{ github.token }}
          COMMENT_MARKER: '<!-- lucent-docgen-drift -->'
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STALE_DOCS: ${{ steps.docgen-drift.outputs.stale }}
        run: |
          doc_paths=(
            docs/public/script-api.d.ts
            docs/src/content/docs/reference/scripting
          )

          gh_error="${RUNNER_TEMP}/docgen-comment-error.log"
          existing_comment_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.user.type == "Bot" and (.body | contains(env.COMMENT_MARKER))) | .id' \
              2> "$gh_error" \
              | tail -n 1 \
              || true
          )"
          if [ -s "$gh_error" ]; then
            echo "::notice title=Unable to read docgen PR comments::$(tr '\n' ' ' < "$gh_error")"
            rm -f "$gh_error"
          fi

          if [ "$STALE_DOCS" != "true" ]; then
            if [ -n "$existing_comment_id" ]; then
              if ! gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
                --silent \
                2> "$gh_error"; then
                echo "::notice title=Unable to delete stale docgen PR comment::$(tr '\n' ' ' < "$gh_error")"
              fi
            fi

            exit 0
          fi

          comment_file="${RUNNER_TEMP}/docgen-comment.md"
          if [ "$AUTO_UPDATED" = "true" ]; then
            short_sha="${AUTO_UPDATE_SHA:0:7}"
            {
              echo "$COMMENT_MARKER"
              echo "### Generated scripting docs updated"
              echo
              echo "Committed the generated docs in [\`${short_sha}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${AUTO_UPDATE_SHA})."
            } > "$comment_file"
          else
            {
              echo "$COMMENT_MARKER"
              echo "### Generated scripting docs need an update"
              echo
              echo 'Run `pnpm run docgen` locally and commit the generated docs.'
              echo
              echo "Changed generated files:"
              echo '```'
              git status --short -- "${doc_paths[@]}"
              echo '```'
            } > "$comment_file"
          fi
          comment_body="$(cat "$comment_file")"

          if [ -n "$existing_comment_id" ]; then
            if ! gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
              --raw-field body="$comment_body" \
              --silent \
              2> "$gh_error"; then
              echo "::notice title=Unable to update docgen PR comment::$(tr '\n' ' ' < "$gh_error")"
            fi
          else
            if ! gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --raw-field body="$comment_body" \
              --silent \
              2> "$gh_error"; then
              echo "::notice title=Unable to create docgen PR comment::$(tr '\n' ' ' < "$gh_error")"
            fi
          fi

      - name: Publish docgen artifact check
        if: github.event_name == 'pull_request'
        env:
          AUTO_UPDATED: ${{ steps.pr-docgen-update.outputs.updated }}
          DOCGEN_SKIPPED: ${{ steps.docgen-drift.outputs.skipped }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr-docgen-update.outputs.head_sha || github.event.pull_request.head.sha }}
          STALE_DOCS: ${{ steps.docgen-drift.outputs.stale }}
        run: |
          gh_error="${RUNNER_TEMP}/docgen-check-error.log"
          if [ "$DOCGEN_SKIPPED" = "true" ]; then
            conclusion="neutral"
            title="Generated scripting docs check skipped"
            summary="Skipped because the pull request body contains \`[skip-docgen]\`."
          elif [ "$AUTO_UPDATED" = "true" ]; then
            conclusion="success"
            title="Generated scripting docs updated"
            summary="Committed generated docs to the pull request."
          elif [ "$STALE_DOCS" = "true" ]; then
            conclusion="neutral"
            title="Generated scripting docs need an update"
            summary="Run \`pnpm run docgen\` locally and commit the generated docs."
          else
            conclusion="success"
            title="Generated scripting docs are up to date"
            summary="No generated doc artifacts changed after running docgen."
          fi

          if ! gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/check-runs" \
            --field name="Docgen artifacts" \
            --field head_sha="$HEAD_SHA" \
            --field status="completed" \
            --field conclusion="$conclusion" \
            --field "output[title]=$title" \
            --field "output[summary]=$summary" \
            --silent \
            2> "$gh_error"; then
            echo "::notice title=Unable to publish docgen artifact check::$(tr '\n' ' ' < "$gh_error")"
          fi

      - name: Commit and push documentation updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A docs/public/script-api.d.ts docs/src/content/docs/reference/scripting
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update API documentation"
            gh auth setup-git
            git push
          else
            echo "No documentation changes to commit"
          fi
