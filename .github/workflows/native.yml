name: Native

on:
  pull_request:
    paths:
      - .github/workflows/native.yml
      - Cargo.lock
      - Cargo.toml
      - assets/loader.swf
      - crates/**
      - rust-toolchain.toml
  push:
    branches:
      - feat/ruffle-native
      - main
    paths:
      - .github/workflows/native.yml
      - Cargo.lock
      - Cargo.toml
      - assets/loader.swf
      - crates/**
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace

      - name: Check linked libraries
        if: runner.os == 'macOS'
        run: |
          outside=$(otool -L target/debug/game-window | awk 'NR > 1 { print $1 }' | grep -vE '^(/System/Library/|/usr/lib/)' || true)
          if [ -n "$outside" ]; then
            echo "game-window links libraries that macOS does not ship:"
            echo "$outside"
            exit 1
          fi
